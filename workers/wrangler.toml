name = "link-dispatch-worker"
main = "src/index.js"
compatibility_date = "2026-03-28"
compatibility_flags = ["nodejs_compat"]
[vars]
PUBLIC_BASE_URL = "https://whatapp.pro"
DOMAIN_OPTIONS = "https://whatapp.pro,https://waatapp.pro,https://waatapp.app"
ALLOWED_ORIGIN = "https://whatapp.pro"
ADMIN_PAGE_URL = "https://whatapp.pro/"
LINKS_CACHE_TTL_SECONDS = "300"

[[d1_databases]]
binding = "DB"
database_name = "link-dispatch-db"
database_id = "10a3e90f-52d7-4d4c-8b82-0ee467ce9f3c"

[[durable_objects.bindings]]
name = "LINK_ROUTER_DO"
class_name = "LinkRouterDO"

[[migrations]]
tag = "link-router-do-v1"
new_sqlite_classes = ["LinkRouterDO"]
